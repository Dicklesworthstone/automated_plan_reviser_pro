name: APR session identity validation
on:
  push:
    branches: [apr-session-identity-validation]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Package checkout for offline regression development
        run: tar --exclude=.git -czf "$RUNNER_TEMP/apr-checkout.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: apr-checkout
          path: ${{ runner.temp }}/apr-checkout.tar.gz
          retention-days: 1
